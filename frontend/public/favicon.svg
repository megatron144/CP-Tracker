<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0D1322"/>
      <stop offset="100%" stopColor="#090D16"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#3B82F6" stopOpacity="0.5"/>
      <stop offset="100%" stopColor="#1D4ED8" stopOpacity="0.2"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="10" y1="32" x2="54" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#60A5FA"/>
      <stop offset="50%" stopColor="#3B82F6"/>
      <stop offset="100%" stopColor="#93C5FD"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#3B82F6" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Rounded Dark Box -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="2"/>
  
  <!-- Subtle Blue Tint Overlay -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="#2563EB" fill-opacity="0.12"/>

  <!-- Lucide-style Activity Pulse Heartbeat Line -->
  <path d="M10 32 h8 l7 -18 l14 36 l7 -18 h8" 
        stroke="url(#pulseGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
</svg>